name: Verify flagship foundations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build kernels and run independent failure checks
        run: python3 tools/verify.py
